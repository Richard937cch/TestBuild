<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Exhibit_DEMO</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=540 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Exhibit_DEMO</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/DC1.loader.js";
      
      // --- CONFIGURATION ---
      var config = {
        arguments: [],
        dataUrl: "", // We will set this dynamically later!
        frameworkUrl: buildUrl + "/DC1.framework.js",
        codeUrl: buildUrl + "/DC1.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Exhibit_DEMO",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // --- CUSTOM SPLIT LOADING LOGIC ---
      
      // 1. List your parts here. Make sure these match your actual filenames in the Build folder!
      var dataParts = [
          buildUrl + "/DC1.data.part001",
          buildUrl + "/DC1.data.part002",
          buildUrl + "/DC1.data.part003" 
          // Add "/DC1.data.part4" here if needed...
      ];

      // 2. The function to merge parts
      async function mergeDataChunks(urls) {
          console.log("Beginning manual download of data parts...");
          const responses = await Promise.all(urls.map(url => fetch(url)));
          const buffers = await Promise.all(responses.map(res => res.arrayBuffer()));
          
          const totalLength = buffers.reduce((acc, buf) => acc + buf.byteLength, 0);
          const mergedArray = new Uint8Array(totalLength);
          
          let offset = 0;
          buffers.forEach((buf, index) => {
              mergedArray.set(new Uint8Array(buf), offset);
              offset += buf.byteLength;
              buffers[index] = null; // Help Garbage Collector
          });
          
          console.log("Parts merged. Total size: " + totalLength);
          return mergedArray;
      }
      // ----------------------------------

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "540px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        
        // CALL THE MERGE FUNCTION BEFORE UNITY STARTS
        mergeDataChunks(dataParts).then((mergedData) => {
            
            // Create the Blob
            var blob = new Blob([mergedData]);
            var blobUrl = URL.createObjectURL(blob);
            
            // Free the array memory
            mergedData = null;

            // Inject the Blob URL into Unity's config
            config.dataUrl = blobUrl;

            // Now start Unity normally
            createUnityInstance(canvas, config, (progress) => {
              document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
            }).then((unityInstance) => {
              
              // Clean up loading UI
              document.querySelector("#unity-loading-bar").style.display = "none";
              
              // Revoke the Blob URL to free more memory
              URL.revokeObjectURL(blobUrl);

              document.querySelector("#unity-fullscreen-button").onclick = () => {
                unityInstance.SetFullscreen(1);
              };
            }).catch((message) => {
              alert(message);
            });

        }).catch((err) => {
            console.error(err);
            alert("Failed to load data parts. Check console for details.");
        });
      };

      document.body.appendChild(script);

    </script>
  </body>
</html>
