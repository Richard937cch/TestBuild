<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Exhibit_DEMO</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* --- NEW CSS FOR LOADING TEXT --- */
      #unity-loading-text {
        color: white;
        font-family: Arial, sans-serif;
        font-size: 14px;
        text-align: center;
        margin-top: 10px;
        font-weight: bold;
        text-shadow: 1px 1px 2px black;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=540 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-loading-text">Preparing...</div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Exhibit_DEMO</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var loadingText = document.querySelector("#unity-loading-text");

      // --- HELPER TO UPDATE UI ---
      function updateLoadingUI(percent, stageText) {
        var roundedPercent = Math.round(percent);
        progressBarFull.style.width = percent + "%";
        loadingText.textContent = stageText + " " + roundedPercent + "%";
      }

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/wall1.loader.js";
      
      var config = {
        arguments: [],
        dataUrl: "", // Dynamic
        frameworkUrl: buildUrl + "/wall1.framework.js",
        codeUrl: buildUrl + "/wall1.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Exhibit_DEMO",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // --- CONFIG: LIST YOUR PARTS HERE ---
      // IMPORTANT: Rename your actual files to match these exact names!
      var dataParts = [
          buildUrl + "/wall1.data.part001",
          buildUrl + "/wall1.data.part002",
          buildUrl + "/wall1.data.part003",
          buildUrl + "/wall1.data.part004",
          buildUrl + "/wall1.data.part005"
      ];
      // ------------------------------------

      var fileProgress = dataParts.map(() => ({ loaded: 0, total: 0 }));

      async function downloadPart(url, index) {
  const response = await fetch(url);
  if (!response.ok) throw new Error("Failed to fetch " + url);

  const reader = response.body.getReader();
  const contentLength = +response.headers.get("Content-Length") || 0;

  let receivedLength = 0;
  let chunks = [];

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    receivedLength += value.length;

    fileProgress[index].loaded = receivedLength;
    fileProgress[index].total = contentLength; // may be 0 — handled below
    updateTotalDownloadProgress();
  }

  const buffer = new Uint8Array(receivedLength);
  let position = 0;
  for (let chunk of chunks) {
    buffer.set(chunk, position);
    position += chunk.length;
  }

  return buffer.buffer;
}

      function updateTotalDownloadProgress() {
  let totalLoaded = 0;
  let totalSize = 0;
  let hasSizeInfo = true;

  fileProgress.forEach(part => {
    totalLoaded += part.loaded;
    if (part.total > 0) {
      totalSize += part.total;
    } else {
      hasSizeInfo = false;
    }
  });

  if (hasSizeInfo && totalSize > 0) {
    const percent = (totalLoaded / totalSize) * 100;
    updateLoadingUI(percent, "Downloading Data...");
  } else {
    // Fallback: show bytes downloaded instead
    const mb = (totalLoaded / (1024 * 1024)).toFixed(1);
    loadingText.textContent = "Downloading Data... " + mb + " MB";
  }
}


      async function mergeDataChunks(urls) {
          updateLoadingUI(0, "Starting Download...");
          
          // 1. Download
          const buffers = await Promise.all(urls.map((url, index) => downloadPart(url, index)));
          
          // 2. Merge
          loadingText.textContent = "Merging Files...";
          
          const totalLength = buffers.reduce((acc, buf) => acc + buf.byteLength, 0);
          const mergedArray = new Uint8Array(totalLength);
          
          let offset = 0;
          buffers.forEach((buf, index) => {
              mergedArray.set(new Uint8Array(buf), offset);
              offset += buf.byteLength;
              buffers[index] = null; 
          });
          
          return mergedArray;
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "540px";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        
        mergeDataChunks(dataParts).then((mergedData) => {
            
            var blob = new Blob([mergedData]);
            var blobUrl = URL.createObjectURL(blob);
            mergedData = null; 

            config.dataUrl = blobUrl;
            
            // 3. Initialize Unity
            createUnityInstance(canvas, config, (progress) => {
              // This progress comes from Unity (WASM compilation, scene loading)
              // progress is 0.0 to 1.0, so multiply by 100
              updateLoadingUI(progress * 100, "Initializing Engine...");
            }).then((unityInstance) => {
              
              loadingBar.style.display = "none";
              URL.revokeObjectURL(blobUrl);

              document.querySelector("#unity-fullscreen-button").onclick = () => {
                unityInstance.SetFullscreen(1);
              };
            }).catch((message) => {
              alert(message);
            });

        }).catch((err) => {
            console.error(err);
            loadingText.textContent = "Error: " + err;
            loadingText.style.color = "red";
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
